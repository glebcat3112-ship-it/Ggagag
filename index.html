<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#0d0e10">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title></title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Manrope:wght@500;600;700;800&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  /* ЦВЕТА ТЕМЫ — меняйте здесь */
  --bg:#0d0e10;      /* фон приложения */
  --card:#1a1c20;    /* карточки */
  --soft:#25282d;    /* плашки, активная вкладка */
  --line:#2a2d33;    /* разделители */
  --text:#f1f2f4;    /* основной текст */
  --muted:#8b9099;  /* серый текст */
  --acc1:#6d737d; --acc2:#3a3e45; /* градиент кнопок */
  --lnk:#b5bbc4;     /* МАКС, акценты */
  --green:#3ec486; --red:#ef6a65;
  color-scheme:dark;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,sans-serif;overscroll-behavior:none}
body{min-height:100vh;padding-bottom:calc(88px + var(--safe-b))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit;border:0;outline:0;background:none;width:100%}
.app{max-width:520px;margin:0 auto;padding:0 16px}

.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.3px}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#6a7079,#2b2f34);display:grid;place-items:center;box-shadow:0 4px 12px rgba(30,34,40,.25)}
.chip{display:flex;align-items:center;gap:8px;background:var(--card);padding:5px 12px 5px 5px;border-radius:30px;font-size:14px;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.ava{width:28px;height:28px;border-radius:50%;background:linear-gradient(145deg,#8a9099,#4a4f56);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600;overflow:hidden;flex:none}
.ava img{width:100%;height:100%;object-fit:cover}

.bal{text-align:center;padding:22px 0 18px}
.bal .sum{font-size:44px;font-weight:700;letter-spacing:-1.5px;display:inline-flex;align-items:center;gap:10px}
.bal .sum small{font-size:30px;color:var(--muted);font-weight:600}
.eye{width:26px;height:26px;color:var(--muted)}
.bal .sub{color:var(--muted);font-size:14px;margin-top:2px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.act{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:500;color:#3a3f46}
.act .ic{width:54px;height:54px;border-radius:50%;background:linear-gradient(145deg,var(--acc1),var(--acc2));display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px rgba(30,34,40,.22);transition:transform .15s}
.act:active .ic{transform:scale(.92)}

.banners{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:22px -16px 0;padding:0 16px;scrollbar-width:none}
.banners::-webkit-scrollbar{display:none}
.bn{flex:0 0 100%;scroll-snap-align:center;border-radius:20px;padding:18px;background:linear-gradient(135deg,#ffffff,#e3e6ea);display:flex;align-items:center;gap:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.bn .bi{width:48px;height:48px;border-radius:14px;background:linear-gradient(145deg,var(--acc1),var(--acc2));display:grid;place-items:center;color:#fff;flex:none}
.bn b{display:block;font-size:16px;margin-bottom:2px}
.bn span{font-size:13px;color:var(--muted);line-height:1.3}
.dots{display:flex;justify-content:center;gap:6px;margin:10px 0 4px}
.dots i{width:6px;height:6px;border-radius:3px;background:#c9cdd3;transition:.25s}
.dots i.on{width:22px;background:var(--acc1)}

.h{display:flex;align-items:center;justify-content:space-between;margin:18px 4px 10px;font-size:17px;font-weight:650}
.h a{font-size:14px;color:var(--muted);font-weight:500}
.card{background:var(--card);border-radius:22px;padding:4px 16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);-webkit-user-select:none;user-select:none}
.row:last-child{border-bottom:0}
.ci{width:44px;height:44px;border-radius:50%;flex:none;overflow:hidden;display:block}
.ci svg,.ci img{display:block;width:100%;height:100%}
.ci.sm{width:34px;height:34px}
.ci.hi{display:grid;place-items:center;background:var(--soft);color:#4a4f56}
.ci.hi svg{width:22px;height:22px}
.ci.hi.sm svg{width:18px;height:18px}
.row .m{flex:1;min-width:0}
.row .n{font-weight:600;font-size:16px}
.row .p{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right}
.row .r .a{font-weight:600;font-size:16px}
.row .r .u{font-size:13px;color:var(--muted);margin-top:2px}
.up{color:var(--green)} .dn{color:var(--red)}
.more{display:flex;align-items:center;gap:12px;padding:14px 0;color:#3a3f46;font-weight:500;width:100%}

.tab{display:none;animation:fade .25s ease}
.tab.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--safe-b));width:calc(100% - 24px);max-width:496px;background:rgba(255,255,255,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:28px;display:flex;padding:6px;box-shadow:0 8px 30px rgba(20,24,30,.14);z-index:20}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:22px;font-size:11.5px;color:var(--muted);font-weight:500;transition:.2s}
.nav button.on{background:var(--soft);color:var(--text)}
.nav svg{width:24px;height:24px}

.box{background:var(--card);border-radius:22px;padding:16px 18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.box .lab{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:10px;align-items:center}
.box .lab b{color:var(--acc1);font-weight:600;cursor:pointer;margin-left:8px}
.box .ln{display:flex;align-items:center;gap:10px}
.pick{display:flex;align-items:center;gap:8px;background:var(--soft);padding:5px 12px 5px 5px;border-radius:30px;font-weight:650;font-size:17px;flex:none}
.pick .ci{width:32px;height:32px}
.pick svg.chev{width:14px;height:14px;color:var(--muted)}
.amt{font-size:32px;font-weight:650;text-align:right;letter-spacing:-.5px}
.amt::placeholder{color:#c3c7cd}
.outv{font-size:32px;font-weight:650;text-align:right;width:100%;letter-spacing:-.5px;color:#9aa0a8}
.outv.has{color:var(--text)}
.flip{width:42px;height:42px;border-radius:50%;background:var(--card);border:4px solid var(--bg);margin:-14px auto;position:relative;z-index:2;display:grid;place-items:center;color:var(--acc1);transition:transform .3s}
.btn{display:block;width:100%;padding:16px;border-radius:18px;background:linear-gradient(145deg,var(--acc1),var(--acc2));color:#fff;font-weight:650;font-size:17px;text-align:center;margin-top:16px;box-shadow:0 6px 16px rgba(30,34,40,.2);transition:.15s}
.btn:active{transform:scale(.98)}
.btn[disabled]{background:#d5d8dd;color:#9aa0a8;box-shadow:none}
.btn.ghost{background:var(--soft);color:var(--text);box-shadow:none}
.info{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);padding:12px 6px 0}
.info b{color:var(--text);font-weight:500}

.pf{text-align:center;padding:20px 0 6px}
.pf .ava{width:84px;height:84px;font-size:32px;margin:0 auto 12px}
.pf h2{font-size:22px}
.pf p{color:var(--muted);font-size:14px;margin-top:2px}
.pbal{background:linear-gradient(145deg,#5a6068,#2b2f34);color:#fff;border-radius:24px;padding:20px;box-shadow:0 8px 22px rgba(30,34,40,.22)}
.pbal small{opacity:.7;font-size:14px}
.pbal .v{font-size:36px;font-weight:700;letter-spacing:-1px;margin-top:4px}
.kv{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid var(--line);font-size:16px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.sw{width:46px;height:28px;border-radius:14px;background:#cfd3d8;position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--acc2)}
.sw.on::after{left:21px}

.ov{position:fixed;inset:0;background:rgba(20,24,30,.38);opacity:0;pointer-events:none;transition:.25s;z-index:50}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:520px;max-height:86vh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 16px calc(20px + var(--safe-b));transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:60}
.sheet.on{transform:translate(-50%,0)}
.grab{width:40px;height:5px;background:#c9cdd3;border-radius:3px;margin:0 auto 12px}
.sheet h3{font-size:19px;text-align:center;margin-bottom:14px}
.fld{background:var(--card);border-radius:18px;padding:12px 16px;margin-bottom:10px;display:block}
.fld label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.fld input{font-size:17px;font-weight:500}
.fld .sel{display:flex;align-items:center;gap:10px}
.fld .sel .ci{width:30px;height:30px}
.addr{word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.45}
.note{font-size:13px;color:var(--muted);text-align:center;margin:10px 8px 0;line-height:1.4}
.empty{text-align:center;color:var(--muted);padding:34px 0}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-90px);background:var(--acc2);color:#fff;padding:12px 20px;border-radius:16px;font-size:14.5px;font-weight:500;z-index:100;transition:.3s;max-width:90%;text-align:center}
.toast.on{transform:translate(-50%,0)}
.demo{display:inline-block;background:#dfe2e6;color:#5b616a;font-size:11px;font-weight:600;padding:2px 8px;border-radius:8px;margin-left:8px;vertical-align:middle}

/* ===== Чёрно-серая тема: правки жёстко заданных цветов ===== */
.nav{background:rgba(26,28,32,.92);box-shadow:0 8px 30px rgba(0,0,0,.55)}
.act,.more{color:#c9cdd3}
.act .ic{border:1px solid #4a4f56;box-shadow:0 6px 16px rgba(0,0,0,.45)}
.logo{border:1px solid #3a3e45;box-shadow:none}
.chip,.card,.box,.fld,.of{box-shadow:none}
.bn{background:linear-gradient(135deg,#202328,#15171a);box-shadow:none}
.dots i{background:#3a3e45}
.dots i.on{background:var(--lnk)}
.box .lab b,.flip{color:var(--lnk)}
.btn{box-shadow:0 6px 16px rgba(0,0,0,.4)}
.btn[disabled]{background:#25282d;color:#6c717a}
.amt::placeholder{color:#4a4f56}
.sw{background:#3a3e45}
.sw.on{background:#8f96a0}
.ov{background:rgba(0,0,0,.62)}
.sheet{background:#121316}
.grab{background:#3a3e45}
.ci.hi{color:#c9cdd3}
.pbal{background:linear-gradient(145deg,#31343a,#1c1e22);border:1px solid #2a2d33;box-shadow:none}
.toast{background:#3a3e45}

/* ===== Шрифты: у каждого свой участок =====
   Unbounded     — название приложения
   Manrope       — заголовки, крупные суммы, кнопки, названия монет
   Onest         — основной текст и подписи
   JetBrains Mono — цены, количество монет, адреса, ID */
:root{
  --f-brand:'Unbounded','Manrope',sans-serif;
  --f-head:'Manrope','Onest',-apple-system,'Segoe UI',sans-serif;
  --f-body:'Onest',-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
html,body{font-family:var(--f-body)}
.brand{font-family:var(--f-brand);font-weight:600;font-size:17px;letter-spacing:-.2px}
.bal .sum,.pbal .v,.cusd{font-family:var(--f-head);font-weight:800}
.h,.sheet h3,.pf h2,.bn b,.btn,.pick,.act,.row .n,.cbar h2,.ranges button{font-family:var(--f-head)}
.h,.sheet h3,.pf h2{font-weight:800}
.row .n{font-weight:700}
.act{font-weight:600}
.row .p,.row .r .a,.row .r .u,.info b,.kv b,.addr,.camt,.pcard .pr span{font-family:var(--f-mono)}
.row .p{font-size:12px}
.row .r .a{font-size:14px;font-weight:500}
.row .r .u{font-size:12px}
.amt,.outv{font-family:var(--f-mono);font-weight:500;font-size:28px;letter-spacing:-.5px}

/* ===== Экран монеты ===== */
#assets .row[data-s],#meAssets .row[data-s]{cursor:pointer;transition:opacity .12s}
#assets .row[data-s]:active,#meAssets .row[data-s]:active{opacity:.6}
.coin{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;transform:translateX(100%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s}
.coin.on{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s}
.coin .in{max-width:520px;margin:0 auto;padding:0 16px calc(32px + var(--safe-b))}
.cbar{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px;position:sticky;top:0;background:var(--bg);z-index:3}
.cbar button{width:40px;height:40px;margin-left:-8px;display:grid;place-items:center;border-radius:50%}
.cbar h2{font-size:19px;font-weight:700}
.chero{position:relative;height:176px;margin-top:6px}
.chero .big,.chero .sm{position:absolute;left:50%;top:50%;border-radius:50%;overflow:hidden}
.chero .big{width:84px;height:84px;margin:-42px 0 0 -42px}
.chero .sm{opacity:.22;filter:saturate(.5) brightness(.8)}
.chero img{display:block;width:100%;height:100%}
.clab{text-align:center;font-size:17px;color:#d6d9de;margin-top:4px}
.cusd{display:flex;justify-content:center;align-items:center;gap:10px;font-size:44px;letter-spacing:-1.2px;margin-top:6px;line-height:1.15}
.cusd .eye{width:24px;height:24px;cursor:pointer}
.camt{text-align:center;color:var(--muted);font-size:15px;margin-top:6px}
.pcard{background:var(--card);border-radius:24px;padding:18px 18px 14px;margin-top:26px}
.pcard .pr{display:flex;align-items:baseline;gap:10px}
.pcard .pr b{font-family:var(--f-head);font-size:24px;font-weight:800;letter-spacing:-.4px}
.pcard .pr span{font-size:13px;font-weight:500}
.pcard .pl{color:#c9cdd3;font-size:15px;margin-top:2px;min-height:21px}
.chart{position:relative;height:150px;margin:8px -4px 0;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.chart svg{display:block}
.cload{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}
.ranges{display:flex;justify-content:space-between;margin:10px -6px 0}
.ranges button{padding:9px 15px;border-radius:22px;color:var(--muted);font-size:15px;font-weight:700;box-shadow:inset 0 0 0 1.5px transparent;transition:.15s}
.ranges button.on{background:var(--soft);color:var(--text);box-shadow:inset 0 0 0 1.5px #5b616a}
.chh{font-family:var(--f-head);font-weight:800;font-size:18px;color:#d6d9de;margin:30px 4px 12px}
.flt{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.fp{position:relative;display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:24px;background:var(--card);border:1px solid var(--line);font-size:15px;color:#c9cdd3}
.fp svg.chev{width:15px;height:15px;color:var(--muted)}
.fp select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;background:var(--card);color:var(--text)}

/* ===== Избранное, адрес на экране монеты, QR, недавние получатели ===== */
.fav{width:13px;height:13px;margin-left:6px;color:var(--lnk);vertical-align:-1px}
.cbar #cFav{margin:0 -8px 0 auto;color:var(--muted)}
.cbar #cFav.on{color:var(--lnk)}
.cbar #cFav.on svg{fill:currentColor}
.caddr{display:flex;align-items:center;gap:8px;margin:14px auto 0;padding:8px 14px;border-radius:12px;background:var(--card);font-size:13px;color:var(--muted);font-family:var(--f-mono)}
.caddr svg{width:15px;height:15px;color:var(--lnk);flex:none}
.qr{width:208px;margin:0 auto 12px;padding:10px;background:#fff;border-radius:12px}
.qr svg{display:block;width:100%;height:auto}
.rct{font-size:13px;color:var(--muted);margin:0 4px 6px}
.rcl{display:flex;gap:8px;overflow-x:auto;margin:0 0 10px;scrollbar-width:none}
.rcl::-webkit-scrollbar{display:none}
.rcp{flex:none;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:30px;background:var(--card);border:1px solid var(--line);font-size:14px;font-family:var(--f-mono)}
.rcp i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:12px;font-family:var(--f-body);font-weight:600}
.toast.in{box-shadow:inset 4px 0 0 var(--green)}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">
      <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"><path d="M12 2.5 20.5 7.5v9L12 21.5 3.5 16.5v-9z"/><path d="M15.5 9.8c-.6-.9-1.6-1.4-2.8-1.4-2 0-3.4 1.5-3.4 3.6s1.4 3.6 3.4 3.6c1.2 0 2.2-.5 2.8-1.4" stroke-linecap="round"/></svg></div>
      <span id="brandName"></span>
    </div>
    <div class="chip" id="chip"><div class="ava" id="chipAva">C</div><span id="chipName">Гость</span></div>
  </div>

  <!-- WALLET -->
  <section class="tab on" id="t-wallet">
    <div class="bal">
      <div class="sum" id="sum"></div>
      <div class="sub" data-t="balLabel"></div>
      <div class="actions">
        <button class="act" onclick="openReceive()"><div class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7 7 17M7 8v9h9"/></svg></div><span data-t="actReceive"></span></button>
        <button class="act" onclick="openSend()"><div class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg></div><span data-t="actSend"></span></button>
        <button class="act" onclick="openHistory()"><div class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div><span data-t="actHistory"></span></button>
      </div>
    </div>
    <div class="banners" id="banners">

/* ---------- QR-код (встроенный генератор, версии 1–6, уровень M) ---------- */
function qrSvg(text) {
  const EC = [0, 10, 16, 26, 18, 24, 16], NB = [0, 1, 1, 1, 2, 2, 4], RAW = [0, 26, 44, 70, 100, 134, 172];
  const exp = [], log = [];
  for (let i = 0, x = 1; i < 255; i++) { exp[i] = x; log[x] = i; x <<= 1; if (x > 255) x ^= 285; }
  for (let i = 255; i < 512; i++) exp[i] = exp[i - 255];
  const mul = (a, b) => a && b ? exp[log[a] + log[b]] : 0;
  const bytes = [...new TextEncoder().encode(text)];
  let v = 1; while (v <= 6 && bytes.length > RAW[v] - EC[v] * NB[v] - 2) v++;
  if (v > 6) return '';
  const nd = RAW[v] - EC[v] * NB[v], bits = [];
  const put = (val, n) => { for (let i = n - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
  put(4, 4); put(bytes.length, 8); bytes.forEach(b => put(b, 8));
  put(0, Math.min(4, nd * 8 - bits.length)); while (bits.length % 8) bits.push(0);
  for (let p = 0xEC; bits.length < nd * 8; p ^= 0xEC ^ 0x11) put(p, 8);
  const data = []; for (let i = 0; i < bits.length; i += 8) data.push(parseInt(bits.slice(i, i + 8).join(''), 2));
  const el = EC[v]; let g = [1];
  for (let i = 0; i < el; i++) { const nn = new Array(g.length + 1).fill(0); g.forEach((c, j) => { nn[j] ^= c; nn[j + 1] ^= mul(c, exp[i]); }); g = nn; }
  const nS = NB[v] - RAW[v] % NB[v], sl = Math.floor(RAW[v] / NB[v]), blocks = []; let k = 0;
  for (let i = 0; i < NB[v]; i++) {
    const d = data.slice(k, k += sl - el + (i < nS ? 0 : 1)), r = new Array(el).fill(0);
    d.forEach(b => { const f = b ^ r.shift(); r.push(0); for (let j = 0; j < el; j++) r[j] ^= mul(g[j + 1], f); });
    if (i < nS) d.push(0);
    blocks.push(d.concat(r));
  }
  const cw = [];
  for (let i = 0; i < blocks[0].length; i++) blocks.forEach((b, j) => { if (i !== sl - el || j >= nS) cw.push(b[i]); });
  const n = 17 + 4 * v, F = []; let M = [];
  for (let i = 0; i < n; i++) { M.push(new Array(n).fill(0)); F.push(new Array(n).fill(0)); }
  const set = (x, y, d) => { M[y][x] = d ? 1 : 0; F[y][x] = 1; };
  for (let i = 0; i < n; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
  const finder = (cx, cy) => { for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) { const x = cx + dx, y = cy + dy, d = Math.max(Math.abs(dx), Math.abs(dy)); if (x >= 0 && x < n && y >= 0 && y < n) set(x, y, d !== 2 && d !== 4); } };
  finder(3, 3); finder(n - 4, 3); finder(3, n - 4);
  if (v > 1) { const a = n - 7; for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(a + dx, a + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1); }
  const fmt = (mask) => {
    let r = mask; for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
    const b = ((mask << 10) | r) ^ 0x5412, gb = (i) => (b >>> i) & 1;
    for (let i = 0; i <= 5; i++) set(8, i, gb(i)); set(8, 7, gb(6)); set(8, 8, gb(7)); set(7, 8, gb(8));
    for (let i = 9; i < 15; i++) set(14 - i, 8, gb(i));
    for (let i = 0; i < 8; i++) set(n - 1 - i, 8, gb(i));
    for (let i = 8; i < 15; i++) set(8, n - 15 + i, gb(i));
    set(8, n - 8, 1);
  };
  fmt(0);
  let bi = 0;
  for (let r = n - 1; r >= 1; r -= 2) {
    if (r === 6) r = 5;
    for (let vt = 0; vt < n; vt++) for (let j = 0; j < 2; j++) {
      const x = r - j, y = ((r + 1) & 2) === 0 ? n - 1 - vt : vt;
      if (!F[y][x] && bi < cw.length * 8) { M[y][x] = (cw[bi >>> 3] >>> (7 - (bi & 7))) & 1; bi++; }
    }
  }
  const MK = [(x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, (x, y) => x % 3 === 0, (x, y) => (x + y) % 3 === 0,
    (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => x * y % 2 + x * y % 3 === 0,
    (x, y) => (x * y % 2 + x * y % 3) % 2 === 0, (x, y) => ((x + y) % 2 + x * y % 3) % 2 === 0];
  const build = (m) => { const R = M.map(r => r.slice()); for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (!F[y][x] && MK[m](x, y)) R[y][x] ^= 1; return R; };
  const pen = (R) => {
    let p = 0, dark = 0;
    for (let a = 0; a < 2; a++) for (let i = 0; i < n; i++) {
      const L = []; for (let j = 0; j < n; j++) L.push(a ? R[j][i] : R[i][j]);
      let run = 1; for (let j = 1; j <= n; j++) { if (j < n && L[j] === L[j - 1]) run++; else { if (run >= 5) p += run - 2; run = 1; } }
      const s = L.join(''); for (let j = 0; j + 11 <= n; j++) { const w = s.substr(j, 11); if (w === '10111010000' || w === '00001011101') p += 40; }
    }
    for (let y = 0; y < n - 1; y++) for (let x = 0; x < n - 1; x++) if (R[y][x] === R[y][x + 1] && R[y][x] === R[y + 1][x] && R[y][x] === R[y + 1][x + 1]) p += 3;
    R.forEach(r => r.forEach(c => dark += c));
    return p + Math.max(0, Math.ceil(Math.abs(dark * 20 / (n * n) - 10)) - 1) * 10;
  };
  let best = 0, bp = Infinity;
  for (let m = 0; m < 8; m++) { const p = pen(build(m)); if (p < bp) { bp = p; best = m; } }
  M = build(best); fmt(best);
  let d = ''; for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (M[y][x]) d += 'M' + (x + 2) + ' ' + (y + 2) + 'h1v1h-1z';
  return `<svg viewBox="0 0 ${n + 4} ${n + 4}" shape-rendering="crispEdges"><path d="${d}" fill="#000"/></svg>`;
}

    $('sdAmt').addEventListener('input', e => e.target.value = e.target.value.replace(/[^0-9.,]/g, ''));

      const a = parseFloat(($('sdAmt').value || '').replace(',', '.'));
      const to = $('sdTo').value.trim();
      if (to.length < 3) return toast(tr('needTo'));

/* ----- график ----- */
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
/* запасной график — для Gram и когда API недоступен: случайное блуждание, заканчивающееся на текущей цене */
function fakeSeries(c, rk) {
  const N = 96, span = RANGES[rk][1], now = Date.now();
  let seed = 7; for (const x of c.s + rk) seed = (seed * 31 + x.charCodeAt(0)) >>> 0;
  const r = rng(seed), stable = c.s === 'USDT' || c.s === 'USDC';
  const vol = (stable ? .0003 : c.s === 'GRAM' ? .002 : .008) * Math.pow(span / 864e5, .25);
  const pull = stable ? .12 : .02;
  const v = new Array(N); v[N - 1] = c.p;
  for (let i = N - 1; i > 0; i--) { let x = v[i] * (1 + (r() - .5) * 2 * vol); x += (c.p - x) * pull; v[i - 1] = x; }
  return v.map((y, i) => [now - span + i * span / (N - 1), y]);
}
const thin = (pts, n = 140) => {
  if (pts.length <= n) return pts;
  const st = (pts.length - 1) / (n - 1);
  return Array.from({ length: n }, (_, i) => pts[Math.round(i * st)]);
};
async function loadChart(c, rk) {
  let pts = null;
  if (c.id) {
    const days = rk === 'max' ? ['max', 365] : [RANGES[rk][0]];
    for (const d of days) {
      try {
        const r = await fetch(`https://api.coingecko.com/api/v3/coins/${c.id}/market_chart?vs_currency=usd&days=${d}`,
          { signal: (window.AbortSignal && AbortSignal.timeout) ? AbortSignal.timeout(7000) : undefined });
        if (!r.ok) continue;
        const j = await r.json();
        if (j.prices && j.prices.length > 1) { pts = thin(j.prices); break; }
      } catch (e) {}
    }
  }
  if (!pts) pts = fakeSeries(c, rk);
  chartCache[c.s + rk] = { t: Date.now(), pts };
  return pts;
}
async function setChart() {
  const sym = cur, rk = crange, el = $('cChart');
  if (!el) return;
  $('cRanges').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.r === rk));
  const hit = chartCache[sym + rk];
  let pts;
  if (hit && Date.now() - hit.t < 3e5) pts = hit.pts;
  else { cpts = null; el.innerHTML = '<div class="cload">' + tr('loading') + '</div>'; pts = await loadChart(C[sym], rk); }
  if (cur !== sym || crange !== rk) return; /* пока грузилось, переключились */
  cpts = pts; drawChart();
}
function drawChart() {
  const el = $('cChart'); if (!el || !cpts) return;
  const W = el.clientWidth || 320, H = el.clientHeight || 150, pad = 10;
  let mn = Infinity, mx = -Infinity;
  cpts.forEach(p => { if (p[1] < mn) mn = p[1]; if (p[1] > mx) mx = p[1]; });
  if (mx === mn) { mx += mx * .001 || 1; mn -= mn * .001 || 1; }
  const n = cpts.length - 1;
  const px = 7, X = (i) => px + i / n * (W - 2 * px), Y = (v) => pad + (1 - (v - mn) / (mx - mn)) * (H - 2 * pad);
  cgeo = { X, Y };
  const line = cpts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join('');
  const first = cpts[0][1], last = cpts[n][1], up = last >= first;
  const col = up ? '#3ec486' : '#ef6a65';
  const pc = (last - first) / first * 100;
  $('cCh').textContent = (pc > 0 ? '+' : '') + pc.toFixed(2) + '%';
  $('cCh').style.color = up ? 'var(--green)' : 'var(--red)';
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="cgr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".32"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <path d="${line}L${X(n).toFixed(1)} ${H}L${X(0).toFixed(1)} ${H}Z" fill="url(#cgr)"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <line id="cX" x1="0" x2="0" y1="0" y2="${H}" stroke="#fff" stroke-opacity=".25" display="none"/>
    <circle id="cDot" r="5" fill="#1a1c20" stroke="${col}" stroke-width="2.2" cx="${X(n).toFixed(1)}" cy="${Y(last).toFixed(1)}"/>
  </svg>`;
}
function showPt(i) {

function applyState(j) {

let lastSig = '';
async function syncServer(first) {
  if (document.hidden && !first) return;
  try {
    const j = await api('sync');
    const prevMax = S.hist.reduce((m, h) => Math.max(m, h.id || 0), 0);
    const wasSrv = srv; srv = true;
    const sig = JSON.stringify([j.bal, j.hist.length ? j.hist[0].id : 0]);
    if (wasSrv && sig === lastSig) return;
    lastSig = sig;
    const fresh = (wasSrv || prevMax) ? j.hist.filter(h => h.id > prevMax && h.type === 'in') : [];
    applyState(j);
    if (fresh.length) {
      notifyIn(fresh);
    }
  } catch (e) { /* сервера нет — работаем локально */ }
}
syncServer(true);
setInterval(() => { if (srv) syncServer(false); }, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && srv) syncServer(false); });

document.title = APP_NAME;
document.getElementById('brandName').textContent = APP_NAME;
document.getElementById('profileNote').textContent = tr('profileNote');
renderAll();
loadPrices();
setInterval(loadPrices, 60000);
</script>
</body>
</html>
